<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-lang="ko" data-currency="KRW" data-font="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KLOUD - Tablet App</title>
  
  <!-- Web App Capabilities (iPad / Galaxy Tab PWA Mode) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070b14">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+KR:wght@300;400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #060911;
      --bg-surface: #0e1422;
      --bg-card: rgba(16, 23, 38, 0.95);
      --bg-card-hover: rgba(24, 35, 58, 0.98);
      --border-subtle: rgba(212, 175, 55, 0.18);
      --border-active: #d4af37;
      --gold-primary: #e6ca65;
      --gold-dark: #b89334;
      --gold-light: #faeab1;
      --text-main: #f5f6f9;
      --text-muted: #9ba5b7;
      --accent-glow: rgba(212, 175, 55, 0.18);
      --sidebar-width: 280px;
      --header-height: 76px;
      --bottom-bar-height: 52px;
      --font-scale: 1;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f3;
      --bg-surface: #eaeae5;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #ffffff;
      --border-subtle: rgba(140, 110, 35, 0.22);
      --border-active: #9a7620;
      --gold-primary: #8a681c;
      --gold-dark: #634b12;
      --gold-light: #3d2e09;
      --text-main: #16171a;
      --text-muted: #5e6473;
    }

    [data-font="large"] { --font-scale: 1.15; }
    [data-font="xlarge"] { --font-scale: 1.32; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* App mode prevents entire viewport bounce */
      font-family: 'Outfit', 'Noto Serif KR', 'Noto Serif JP', -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* APP HEADER */
    header.app-header {
      height: var(--header-height);
      background: var(--bg-surface);
      border-bottom: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-emblem {
      width: 48px;
      height: 48px;
      border: 1.5px solid var(--gold-primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 16px var(--accent-glow);
      background: #17384a;
      flex-shrink: 0;
    }

    .brand-emblem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-titles h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--gold-light);
      line-height: 1.1;
    }

    .brand-titles span {
      font-size: 0.72rem;
      letter-spacing: 4px;
      color: var(--text-muted);
    }

    /* TOP BAR CONTROLS */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .touch-segmented {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 4px;
      gap: 3px;
    }

    .touch-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .touch-btn.active {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      color: #060911;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(212, 175, 55, 0.4);
    }

    [data-theme="light"] .touch-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    }

    .circle-tool-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .circle-tool-btn:active {
      background: var(--gold-primary);
      color: #060911;
      transform: scale(0.96);
    }

    /* TABLET APP MAIN BODY (SIDEBAR + CONTENT SPLIT) */
    .app-body {
      flex: 1;
      display: flex;
      min-height: 0; /* Important for flex scrolling child */
    }

    /* GLOBAL SLEEK SCROLLBAR (No ugly OS default scrollbars) */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.55);
    }

    /* LEFT SIDEBAR (TOUCH OPTIMIZED TABS) */
    aside.app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1.5px solid var(--border-subtle);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, 0.3) transparent;
      -webkit-overflow-scrolling: touch;
      padding: 18px 12px 30px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .side-tab {
      width: 100%;
      min-height: 58px;
      padding: 12px 18px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: calc(1rem * var(--font-scale));
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .side-tab:active {
      transform: scale(0.98);
    }

    .side-tab.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.22), rgba(212, 175, 55, 0.06));
      border-color: var(--gold-primary);
      color: var(--gold-light);
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .side-tab-icon {
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .side-tab-title {
      flex: 1;
      line-height: 1.25;
    }

    /* RIGHT CONTENT PANE */
    main.app-content {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, 0.3) transparent;
      -webkit-overflow-scrolling: touch;
      padding: 24px 32px 50px 32px;
      position: relative;
    }

    /* SEARCH BAR */
    .search-box-row {
      position: relative;
      margin-bottom: 24px;
    }

    .app-search-input {
      width: 100%;
      height: 56px;
      background: rgba(0, 0, 0, 0.3);
      border: 1.5px solid var(--border-subtle);
      border-radius: 16px;
      padding: 0 54px 0 56px;
      color: var(--text-main);
      font-size: calc(1.05rem * var(--font-scale));
      outline: none;
      transition: border 0.2s;
    }

    .app-search-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .search-lens {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      opacity: 0.8;
      pointer-events: none;
    }

    .search-reset {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* CATEGORY VIEW CONTAINER */
    .category-view {
      display: none;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .category-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-hero-header {
      border-left: 4px solid var(--gold-primary);
      padding-left: 18px;
      margin-bottom: 24px;
    }

    .cat-hero-title {
      font-family: 'Cinzel', 'Noto Serif KR', 'Noto Serif JP', serif;
      font-size: calc(1.85rem * var(--font-scale));
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-hero-desc {
      color: var(--text-muted);
      font-size: calc(0.98rem * var(--font-scale));
      margin-top: 6px;
    }

    .cat-banner {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--border-subtle);
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cat-banner img {
      width: 100%;
      height: auto; /* Show entire image without cropping anything */
      max-height: none;
      object-fit: contain;
      display: block;
    }

    /* CARD GRID */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .sub-group-title {
      font-size: calc(1.22rem * var(--font-scale));
      font-weight: 600;
      color: var(--gold-primary);
      margin: 28px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sub-group-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-subtle), transparent);
    }

    .sub-notice-banner {
      margin: -6px 0 18px 0;
      padding: 12px 18px;
      background: rgba(212, 175, 55, 0.09);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-left: 4px solid var(--gold-primary);
      border-radius: 10px;
      color: var(--gold-light);
      font-size: calc(0.92rem * var(--font-scale));
      font-weight: 600;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* ITEM CARD */
    .item-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }

    .item-card:hover {
      border-color: var(--border-active);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .item-card.highlight {
      border: 2px solid var(--gold-primary);
      background: linear-gradient(145deg, rgba(212, 175, 55, 0.14), rgba(16, 23, 38, 0.98));
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 10px;
    }

    .title-area {
      flex: 1;
    }

    .name-main {
      font-size: calc(1.18rem * var(--font-scale));
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .name-sub {
      font-size: calc(0.88rem * var(--font-scale));
      color: var(--text-muted);
      margin-top: 3px;
      font-style: italic;
    }

    .card-badge {
      display: inline-block;
      padding: 3px 9px;
      background: rgba(212, 175, 55, 0.18);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      font-size: calc(0.74rem * var(--font-scale));
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* PRICE AREA */
    .price-box {
      text-align: right;
      flex-shrink: 0;
    }

    .val-main {
      font-family: 'Cinzel', 'Outfit', sans-serif;
      font-size: calc(1.42rem * var(--font-scale));
      font-weight: 700;
      color: var(--gold-light);
      white-space: nowrap;
    }

    .val-converted {
      font-size: calc(0.82rem * var(--font-scale));
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .dual-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: right;
    }

    .dual-row {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
    }

    .dual-lbl {
      font-size: calc(0.76rem * var(--font-scale));
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .card-desc {
      font-size: calc(0.94rem * var(--font-scale));
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 8px;
      white-space: pre-line;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .card-tag {
      font-size: calc(0.76rem * var(--font-scale));
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.22);
      color: var(--gold-light);
    }

    .card-note {
      font-size: calc(0.82rem * var(--font-scale));
      color: #e09351;
      margin-top: 8px;
    }

    /* BOTTOM APP BAR */
    footer.app-bottom-bar {
      height: var(--bottom-bar-height);
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: calc(0.82rem * var(--font-scale));
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 100;
    }

    .bottom-hours {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-light);
    }

    /* LUXURY PHOTO POPUP MODAL */
    .detail-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .detail-modal-overlay.open {
      display: flex;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .detail-modal-box {
      background: var(--bg-surface);
      border: 1.5px solid var(--gold-primary);
      border-radius: 20px;
      max-width: 620px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px var(--accent-glow);
      position: relative;
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(20px) scale(0.96); }
      to { transform: translateY(0) scale(1); }
    }

    .modal-close-touch {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }

    .modal-close-touch:active {
      transform: scale(0.92);
      background: var(--gold-primary);
      color: #000;
    }

    .modal-img-holder {
      width: 100%;
      height: 340px;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.12), #070b14);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .modal-img-holder img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
      transition: transform 0.3s;
    }

    .modal-no-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      gap: 10px;
    }

    .modal-no-img-placeholder .wine-icon {
      font-size: 3.5rem;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(212, 175, 55, 0.18);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-title-main {
      font-size: calc(1.4rem * var(--font-scale));
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .modal-title-sub {
      font-size: calc(0.95rem * var(--font-scale));
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }

    .modal-price-box {
      margin: 18px 0;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .modal-price-val {
      font-family: 'Cinzel', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--gold-light);
    }

    .modal-desc-text {
      font-size: calc(0.96rem * var(--font-scale));
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
    }

    .modal-tap-hint {
      text-align: center;
      padding: 10px;
      font-size: 0.78rem;
      color: var(--gold-dark);
      border-top: 1px solid rgba(212, 175, 55, 0.1);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- TOP TABLET APP HEADER -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-emblem">
          <img src="img/ac_marriott_logo.jpg" alt="AC Hotel Logo">
        </div>
        <div class="brand-titles">
          <h1>KLOUD</h1>
          <span>AC HOTEL BY MARRIOTT</span>
        </div>
      </div>

      <!-- TOUCH CONTROL SET -->
      <div class="controls-group">
        <!-- Currency -->
        <div class="touch-segmented" id="appCurrencyGroup">
          <button class="touch-btn active" data-cur="KRW">₩ KRW</button>
          <button class="touch-btn" data-cur="USD">$ USD</button>
          <button class="touch-btn" data-cur="JPY">¥ JPY</button>
        </div>

        <!-- Language -->
        <div class="touch-segmented" id="appLangGroup">
          <button class="touch-btn active" data-lang="ko">한국어</button>
          <button class="touch-btn" data-lang="en">EN</button>
          <button class="touch-btn" data-lang="ja">日本語</button>
        </div>

        <!-- Senior Font Scale -->
        <button class="circle-tool-btn" id="appFontScale" title="글자 크기">
          <span id="fontScaleTxt">가A</span>
        </button>

        <!-- Theme Mode -->
        <button class="circle-tool-btn" id="appThemeToggle" title="테마 변경">
          <span id="appThemeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- MAIN APP SPLIT -->
    <div class="app-body">
      <!-- FIXED LEFT SIDEBAR TABS -->
      <aside class="app-sidebar" id="appSidebar">
        <!-- Rendered via JS -->
      </aside>

      <!-- SCROLLABLE RIGHT MENU PANE -->
      <main class="app-content" id="appContent">
        <!-- Quick Search Field -->
        <div class="search-box-row">
          <span class="search-lens">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" class="app-search-input" id="appSearchInput" placeholder="메뉴 이름, 주류 검색 (Search dish, whisky, wine...)" autocomplete="off">
          <button class="search-reset" id="appSearchReset">✕</button>
        </div>

        <!-- Category View Containers -->
        <div id="categoryViewsContainer">
          <!-- Dynamically populated -->
        </div>
      </main>
    </div>

    <!-- BOTTOM BAR -->
    <footer class="app-bottom-bar">
      <div class="bottom-hours">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.85;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <strong>6:00 PM – 1:00 AM</strong> 
        <span style="opacity: 0.5;">|</span>
        <span>Food L.O 11:30 PM &nbsp;•&nbsp; Drink L.O 12:30 AM</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span id="appNoticeText">* 1인 1음료 주문 부탁드립니다. (1 drink per person)</span>
        <span class="app-mode-tag">TABLET MODE</span>
      </div>
    </footer>
  </div>

  <!-- LUXURY DETAIL MODAL (TAP ON ANY CARD TO OPEN) -->
  <div class="detail-modal-overlay" id="detailModalOverlay">
    <div class="detail-modal-box" id="detailModalBox">
      <button class="modal-close-touch" id="btnCloseDetailModal">✕</button>
      <div class="modal-img-holder" id="modalImgHolder">
        <!-- Dynamic Photo -->
      </div>
      <div class="modal-body">
        <div id="modalBadgeArea"></div>
        <h3 class="modal-title-main" id="modalTitleMain"></h3>
        <div class="modal-title-sub" id="modalTitleSub"></div>
        <div class="modal-price-box" id="modalPriceBox"></div>
        <p class="modal-desc-text" id="modalDescText"></p>
        <div id="modalDonenessArea"></div>
        <div id="modalTagsArea"></div>
      </div>
      <div class="modal-tap-hint" id="modalTapHint">
        * 탭하여 닫기 (Tap anywhere outside to close)
      </div>
    </div>
  </div>

  <!-- MENU DATA & APP SCRIPT -->
  <script src="menu-data.js"></script>
  <script>
    // State
    let currentLang = localStorage.getItem('kloud_lang') || 'en';
    let currentCurrency = localStorage.getItem('kloud_currency') || 'KRW';
    let currentTheme = localStorage.getItem('kloud_theme') || 'dark';
    let currentFont = localStorage.getItem('kloud_font') || 'normal';
    // Flat Item Registry for 100% bug-free click handling
    const itemRegistry = {};
    let regCounter = 0;
    menuData.categories.forEach(cat => {
      if (cat.items) {
        cat.items.forEach(it => {
          it._regId = 'item_' + (++regCounter);
          itemRegistry[it._regId] = it;
        });
      }
      if (cat.subsections) {
        cat.subsections.forEach(sub => {
          sub.items.forEach(it => {
            it._regId = 'item_' + (++regCounter);
            itemRegistry[it._regId] = it;
          });
        });
      }
    });

    let activeCatId = menuData.categories[0].id;
    let searchQuery = '';

    const FX_USD = 1350;
    const FX_JPY = 9.0;

    function applyAttributes() {
      document.documentElement.setAttribute('data-lang', currentLang);
      document.documentElement.setAttribute('data-currency', currentCurrency);
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.documentElement.setAttribute('data-font', currentFont);
    }

    function formatPrice(amountKrw) {
      if (!amountKrw) return { main: '', converted: '' };
      const krw = `₩${amountKrw.toLocaleString('ko-KR')}`;
      const usd = `$${Math.round(amountKrw / FX_USD).toLocaleString('en-US')}`;
      const jpy = `¥${Math.round(amountKrw / FX_JPY).toLocaleString('ja-JP')}`;

      if (currentCurrency === 'KRW') {
        return { main: krw, converted: `(${usd} / ${jpy})` };
      } else if (currentCurrency === 'USD') {
        return { main: usd, converted: `(KRW ₩${amountKrw.toLocaleString('ko-KR')})` };
      } else {
        return { main: jpy, converted: `(KRW ₩${amountKrw.toLocaleString('ko-KR')})` };
      }
    }

    function updateUIStrings() {
      // Currency active state
      document.querySelectorAll('#appCurrencyGroup .touch-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-cur') === currentCurrency);
      });

      // Lang active state
      document.querySelectorAll('#appLangGroup .touch-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
      });

      // Font Scale label
      const fTxt = document.getElementById('fontScaleTxt');
      fTxt.textContent = currentFont === 'normal' ? '가A' : (currentFont === 'large' ? '가+' : '가++');

      // Theme Icon
      document.getElementById('appThemeIcon').textContent = currentTheme === 'dark' ? '🌙' : '☀️';

      // Search placeholder & Notice
      const searchInput = document.getElementById('appSearchInput');
      const noticeText = document.getElementById('appNoticeText');

      if (currentLang === 'ko') {
        searchInput.placeholder = '메뉴 이름, 주류 검색 (예: 발베니, 한맥, 스테이크, 파스타)...';
        noticeText.textContent = '* 1인 1음료 주문 부탁드립니다.';
      } else if (currentLang === 'en') {
        searchInput.placeholder = 'Search dish, wine, whisky, draft beer...';
        noticeText.textContent = '* 1 drink per person is required.';
      } else {
        searchInput.placeholder = 'メニュー検索 (ウイスキー、生ビール、ステーキなど)...';
        noticeText.textContent = '※ お一人様1ドリンクのご注文をお願いしております。';
      }
    }

    function renderSidebar() {
      const sidebar = document.getElementById('appSidebar');
      sidebar.innerHTML = '';

      menuData.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `side-tab ${cat.id === activeCatId ? 'active' : ''}`;
        btn.innerHTML = `<span class="side-tab-title">${escapeHtml(cat.name[currentLang] || cat.name.en)}</span>`;
        btn.onclick = () => {
          activeCatId = cat.id;
          document.querySelectorAll('.side-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderViews();
          // Scroll content back to top smoothly
          document.getElementById('appContent').scrollTo({ top: 0, behavior: 'smooth' });
        };
        sidebar.appendChild(btn);
      });
    }

    function renderViews() {
      const container = document.getElementById('categoryViewsContainer');
      container.innerHTML = '';

      const query = searchQuery.trim().toLowerCase();

      // If searching, show all matching categories
      const targetCategories = query 
        ? menuData.categories 
        : menuData.categories.filter(c => c.id === activeCatId);

      let foundAny = false;

      targetCategories.forEach(cat => {
        let hasItems = false;
        const viewEl = document.createElement('div');
        viewEl.className = 'category-view active';

        let html = `
          <div class="cat-hero-header">
            <h2 class="cat-hero-title">${escapeHtml(cat.name[currentLang] || cat.name.en)}</h2>
            <p class="cat-hero-desc">${cat.desc[currentLang] || cat.desc.en}</p>
          </div>
        `;

        if (cat.bannerImage && !query) {
          html += `
            <div class="cat-banner">
              <img src="${cat.bannerImage}" alt="${cat.name[currentLang]}" loading="lazy">
            </div>
          `;
        }

        if (cat.items && cat.items.length > 0) {
          const filtered = cat.items.filter(item => matchSearch(item, query));
          if (filtered.length > 0) {
            hasItems = true;
            foundAny = true;
            html += `<div class="app-grid">${filtered.map(renderCard).join('')}</div>`;
          }
        }

        if (cat.subsections && cat.subsections.length > 0) {
          cat.subsections.forEach(sub => {
            const filteredSub = sub.items.filter(item => matchSearch(item, query));
            if (filteredSub.length > 0) {
              hasItems = true;
              foundAny = true;
              const subNotice = sub.notice ? (sub.notice[currentLang] || sub.notice.en) : '';
              html += `
                <div class="sub-group-title">${sub.title[currentLang] || sub.title.en}</div>
                ${subNotice ? `
                  <div class="sub-notice-banner">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; opacity: 0.9;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>${escapeHtml(subNotice)}</span>
                  </div>
                ` : ''}
                <div class="app-grid">${filteredSub.map(renderCard).join('')}</div>
              `;
            }
          });
        }

        if (hasItems || !query) {
          viewEl.innerHTML = html;
          container.appendChild(viewEl);
        }
      });

      if (query && !foundAny) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <div style="margin-bottom: 16px; opacity: 0.4;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <h3>${currentLang === 'ko' ? '검색 결과가 없습니다' : (currentLang === 'ja' ? '検索結果がありません' : 'No menu items found')}</h3>
            <p style="margin-top: 6px;">"${escapeHtml(query)}"</p>
          </div>
        `;
      }
    }

    function matchSearch(item, q) {
      if (!q) return true;
      const nKo = (item.name?.ko || '').toLowerCase();
      const nEn = (item.name?.en || '').toLowerCase();
      const nJa = (item.name?.ja || '').toLowerCase();
      const dKo = (item.desc?.ko || '').toLowerCase();
      const dEn = (item.desc?.en || '').toLowerCase();
      const dJa = (item.desc?.ja || '').toLowerCase();
      const tags = (item.tags || []).join(' ').toLowerCase();
      return nKo.includes(q) || nEn.includes(q) || nJa.includes(q) || dKo.includes(q) || dEn.includes(q) || dJa.includes(q) || tags.includes(q);
    }

    function renderCard(item) {
      const mainName = item.name[currentLang] || item.name.en;
      const subName = currentLang === 'ko' ? item.name.en : item.name.ko;
      const desc = item.desc ? (item.desc[currentLang] || item.desc.en || '') : '';
      const badge = item.badge ? `<span class="card-badge">${item.badge[currentLang] || item.badge.en}</span>` : '';
      const note = item.note ? `<div class="card-note">${item.note[currentLang] || item.note.en}</div>` : '';
      const vintage = item.vintage ? `<span class="card-tag" style="border-radius:4px;">Vintage ${item.vintage}</span>` : '';

      let priceHtml = '';
      if (item.glassPrice || item.bottlePrice) {
        const g = formatPrice(item.glassPrice);
        const b = formatPrice(item.bottlePrice);
        const gLbl = currentLang === 'ko' ? '글라스 (45ml)' : (currentLang === 'ja' ? 'グラス' : 'Glass');
        const bLbl = currentLang === 'ko' ? '보틀' : (currentLang === 'ja' ? 'ボトル' : 'Bottle');

        priceHtml = `
          <div class="dual-box">
            ${item.glassPrice ? `
              <div>
                <div class="dual-row"><span class="dual-lbl">${gLbl}</span><span class="val-main">${g.main}</span></div>
                <div class="val-converted">${g.converted}</div>
              </div>` : ''}
            ${item.bottlePrice ? `
              <div>
                <div class="dual-row"><span class="dual-lbl">${bLbl}</span><span class="val-main">${b.main}</span></div>
                <div class="val-converted">${b.converted}</div>
              </div>` : ''}
          </div>
        `;
      } else if (item.price) {
        const p = formatPrice(item.price);
        priceHtml = `
          <div class="price-box">
            <span class="val-main">${p.main}</span>
            <div class="val-converted">${p.converted}</div>
            ${item.period ? `<div style="font-size: 0.78rem; color: var(--gold-dark); margin-top: 3px;">${item.period[currentLang] || item.period.en}</div>` : ''}
          </div>
        `;
      }

      // Meat Doneness Selection (Rare, Medium Rare, Medium, etc.)
      let donenessHtml = '';
      if (item.donenessOptions && item.donenessOptions.length > 0) {
        const dTitle = currentLang === 'ko' ? '🥩 굽기 선택 (Doneness):' : (currentLang === 'ja' ? '🥩 焼き加減 (Doneness):' : '🥩 Meat Doneness:');
        donenessHtml = `
          <div style="margin-top: 12px; padding: 10px 12px; background: rgba(212, 175, 55, 0.06); border: 1px dashed rgba(212, 175, 55, 0.3); border-radius: 10px;">
            <div style="font-size: calc(0.78rem * var(--font-scale)); color: var(--gold-primary); font-weight: 700; margin-bottom: 6px;">${dTitle}</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              ${item.donenessOptions.map((opt, idx) => `
                <button type="button" class="doneness-chip ${idx === 1 ? 'selected' : ''}" onclick="selectDoneness(this, event)" style="
                  background: ${idx === 1 ? 'linear-gradient(135deg, var(--gold-light), var(--gold-primary))' : 'rgba(255,255,255,0.06)'};
                  color: ${idx === 1 ? '#070b14' : 'var(--text-main)'};
                  border: 1px solid rgba(212,175,55,0.3);
                  padding: 4px 10px;
                  border-radius: 16px;
                  font-size: calc(0.74rem * var(--font-scale));
                  font-weight: 600;
                  cursor: pointer;
                  transition: all 0.2s;
                ">${opt}</button>
              `).join('')}
            </div>
          </div>
        `;
      }

      let tagsHtml = '';
      if (item.tags && item.tags.length > 0) {
        tagsHtml = `<div class="card-tags">${item.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}</div>`;
      }

      return `
        <div class="item-card ${item.highlight ? 'highlight' : ''}" data-reg-id="${item._regId}" onclick="openItemModalById('${item._regId}')" style="cursor: pointer;">
          <div>
            ${badge}
            <div class="card-head">
              <div class="title-area">
                <div class="name-main">${escapeHtml(mainName)}</div>
                <div class="name-sub">${escapeHtml(subName)}</div>
                ${vintage}
              </div>
              ${priceHtml}
            </div>
            ${desc ? `<p class="card-desc">${escapeHtml(desc)}</p>` : ''}
            ${donenessHtml}
            ${tagsHtml}
            ${note}
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function selectDoneness(btn, event) {
      if (event) event.stopPropagation(); // Don't trigger modal when clicking doneness chip
      const parent = btn.parentElement;
      parent.querySelectorAll('.doneness-chip').forEach(b => {
        b.style.background = 'rgba(255,255,255,0.06)';
        b.style.color = 'var(--text-main)';
      });
      btn.style.background = 'linear-gradient(135deg, var(--gold-light), var(--gold-primary))';
      btn.style.color = '#070b14';
    }

    // ITEM DETAIL MODAL CONTROLLER
    const detailOverlay = document.getElementById('detailModalOverlay');
    const modalBox = document.getElementById('detailModalBox');

    function openItemModalById(regId) {
      const item = itemRegistry[regId];
      if (!item) return;

      const isKo = currentLang === 'ko';
      const isJa = currentLang === 'ja';
      const mainName = item.name[currentLang] || item.name.en;
      const subName = isKo ? item.name.en : item.name.ko;
      const desc = item.desc ? (item.desc[currentLang] || item.desc.en || '') : '';
      const badge = item.badge ? `<span class="modal-badge">${item.badge[currentLang] || item.badge.en}</span>` : '';

      document.getElementById('modalTitleMain').textContent = mainName;
      document.getElementById('modalTitleSub').textContent = subName;
      document.getElementById('modalBadgeArea').innerHTML = badge;
      document.getElementById('modalDescText').textContent = desc;

      // Image Handling: if item.image exists, display it; else show elegant placeholder
      const imgHolder = document.getElementById('modalImgHolder');
      if (item.image) {
        imgHolder.innerHTML = `<img src="${item.image}" alt="${escapeHtml(mainName)}" loading="lazy">`;
      } else {
        imgHolder.innerHTML = `
          <div class="modal-no-img-placeholder">
            <span class="wine-icon">🍾</span>
            <div style="font-size: 0.88rem; font-weight: 600; opacity: 0.8;">
              ${isKo ? '사진 준비 중 (Photo Coming Soon)' : (isJa ? '写真準備中' : 'Bottle Photo Coming Soon')}
            </div>
            <div style="font-size: 0.76rem; color: var(--text-muted);">${escapeHtml(mainName)}</div>
          </div>
        `;
      }

      // Price Formatting in Modal
      const priceBox = document.getElementById('modalPriceBox');
      if (item.glassPrice || item.bottlePrice) {
        const g = formatPrice(item.glassPrice);
        const b = formatPrice(item.bottlePrice);
        const gLbl = isKo ? '글라스 (Glass)' : (isJa ? 'グラス' : 'Single Glass');
        const bLbl = isKo ? '보틀 (Bottle)' : (isJa ? 'ボトル' : 'Full Bottle');
        priceBox.innerHTML = `
          <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
            ${item.glassPrice ? `<div style="display: flex; justify-content: space-between; align-items: baseline;"><span>${gLbl}</span><span class="modal-price-val">${g.main} <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 400;">${g.converted}</span></span></div>` : ''}
            ${item.bottlePrice ? `<div style="display: flex; justify-content: space-between; align-items: baseline;"><span>${bLbl}</span><span class="modal-price-val">${b.main} <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 400;">${b.converted}</span></span></div>` : ''}
          </div>
        `;
      } else if (item.price) {
        const p = formatPrice(item.price);
        priceBox.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: baseline; width: 100%;">
            <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">PRICE</span>
            <span class="modal-price-val">${p.main} <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 400;">${p.converted}</span></span>
          </div>
        `;
      }

      // Tags
      const tagsArea = document.getElementById('modalTagsArea');
      if (item.tags && item.tags.length > 0) {
        tagsArea.innerHTML = `<div class="card-tags" style="margin-top: 14px;">${item.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}</div>`;
      } else {
        tagsArea.innerHTML = '';
      }

      // Doneness
      const donenessArea = document.getElementById('modalDonenessArea');
      if (item.donenessOptions && item.donenessOptions.length > 0) {
        const dTitle = isKo ? '🥩 굽기 선택 (Doneness):' : (isJa ? '🥩 焼き加減:' : '🥩 Doneness Options:');
        donenessArea.innerHTML = `
          <div style="margin: 12px 0; padding: 10px; background: rgba(212,175,55,0.06); border: 1px dashed rgba(212,175,55,0.3); border-radius: 10px;">
            <div style="font-size: 0.82rem; color: var(--gold-primary); font-weight: 700; margin-bottom: 6px;">${dTitle}</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              ${item.donenessOptions.map((opt, idx) => `
                <button type="button" class="doneness-chip ${idx === 1 ? 'selected' : ''}" onclick="selectDoneness(this, event)" style="
                  background: ${idx === 1 ? 'linear-gradient(135deg, var(--gold-light), var(--gold-primary))' : 'rgba(255,255,255,0.06)'};
                  color: ${idx === 1 ? '#070b14' : 'var(--text-main)'};
                  border: 1px solid rgba(212,175,55,0.3);
                  padding: 4px 10px; border-radius: 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
                ">${opt}</button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        donenessArea.innerHTML = '';
      }

      detailOverlay.classList.add('open');
    }

    window.openItemModalById = openItemModalById;

    document.getElementById('btnCloseDetailModal').onclick = () => {
      detailOverlay.classList.remove('open');
    };

    detailOverlay.onclick = (e) => {
      if (e.target === detailOverlay) {
        detailOverlay.classList.remove('open');
      }
    };

    // Event Delegation for touch/click compatibility on all devices
    document.addEventListener('click', (e) => {
      const card = e.target.closest('.item-card');
      if (card && card.dataset.regId) {
        if (e.target.closest('.doneness-chip')) return;
        openItemModalById(card.dataset.regId);
      }
    });

    // EVENT LISTENERS
    document.querySelectorAll('#appLangGroup .touch-btn').forEach(btn => {
      btn.onclick = () => {
        currentLang = btn.getAttribute('data-lang');
        localStorage.setItem('kloud_lang', currentLang);
        applyAttributes();
        updateUIStrings();
        renderSidebar();
        renderViews();
      };
    });

    document.querySelectorAll('#appCurrencyGroup .touch-btn').forEach(btn => {
      btn.onclick = () => {
        currentCurrency = btn.getAttribute('data-cur');
        localStorage.setItem('kloud_currency', currentCurrency);
        applyAttributes();
        updateUIStrings();
        renderViews();
      };
    });

    document.getElementById('appFontScale').onclick = () => {
      if (currentFont === 'normal') currentFont = 'large';
      else if (currentFont === 'large') currentFont = 'xlarge';
      else currentFont = 'normal';
      localStorage.setItem('kloud_font', currentFont);
      applyAttributes();
      updateUIStrings();
    };

    document.getElementById('appThemeToggle').onclick = () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('kloud_theme', currentTheme);
      applyAttributes();
      updateUIStrings();
    };

    const sInput = document.getElementById('appSearchInput');
    const sReset = document.getElementById('appSearchReset');

    sInput.oninput = (e) => {
      searchQuery = e.target.value;
      sReset.style.display = searchQuery ? 'flex' : 'none';
      renderViews();
    };

    sReset.onclick = () => {
      sInput.value = '';
      searchQuery = '';
      sReset.style.display = 'none';
      renderViews();
    };

    // Init
    applyAttributes();
    updateUIStrings();
    renderSidebar();
    renderViews();
  </script>
</body>
</html>
